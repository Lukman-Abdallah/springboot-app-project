name: Self-Hosted Runner Test

on:
  push:
    branches:
      - main

jobs:
  runner-test:
    runs-on: self-hosted

    steps:
      - name: Hello from self-hosted runner
        run: |
          echo "======================================"
          echo "Hello from my self-hosted runner!"
          echo "======================================"
          echo "Hostname:"
          hostname
          echo "Operating System:"
          uname -a
